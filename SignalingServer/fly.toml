# fly.toml app configuration file generated for fpsmonitor-server on 2026-09-10T14:22:37+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fpsmonitor-server'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
