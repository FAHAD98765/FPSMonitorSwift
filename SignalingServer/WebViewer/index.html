<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>CALLITNOW</title>

    <style>
        /* =========================
           CONNECTION STATE COLORS
           (body[data-state] switches these)
        ========================= */

        :root {
            --state-color: #f59e0b;
            --state-glow: rgba(245, 158, 11, 0.6);
        }

        body[data-state="connecting"] {
            --state-color: #f59e0b;
            --state-glow: rgba(245, 158, 11, 0.6);
        }

        body[data-state="connected"] {
            --state-color: #22c55e;
            --state-glow: rgba(34, 197, 94, 0.65);
        }

        body[data-state="disconnected"] {
            --state-color: #ef4444;
            --state-glow: rgba(239, 68, 68, 0.65);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            background: #0b0d10;
            color: #ffffff;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .app {
            width: 100%;
            max-width: 1200px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--state-color);
            box-shadow: 0 0 14px var(--state-glow);
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        body[data-state="connecting"] .brand-dot {
            animation: pulse 1.2s ease-in-out infinite;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .viewer-label {
            font-size: 13px;
            color: #8b929d;
        }

        /* =========================
           VIDEO CARD
        ========================= */

        .video-card {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #20242b;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        #remoteVideo {
            display: block;
            width: 100%;
            height: auto;
            min-height: 300px;
            max-height: 75vh;
            object-fit: contain;
            background: #000;
        }

        /* =========================
           VIDEO OVERLAY
           (covers the whole video so the line call
            can be centered inside it)
        ========================= */

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            padding: 16px;
            pointer-events: none;
        }

        .status-badge,
        .fps-badge {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;

            padding: 8px 12px;

            font-size: 13px;
            font-weight: 600;
        }

        .status-badge {
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* colored signal dot inside the status badge */
        .status-badge::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--state-color);
            box-shadow: 0 0 10px var(--state-glow);
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        body[data-state="connecting"] .status-badge::before {
            animation: pulse 1.2s ease-in-out infinite;
        }

        .fps-badge {
            color: var(--state-color);
            transition: color 0.25s ease;
        }

        /* =========================
           LINE CALL
           (big, red, centered on the video)
        ========================= */

        .overlay-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .line-call {
            --call-color: #ef4444;
            --call-glow: rgba(239, 68, 68, 0.6);

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            max-width: calc(100% - 32px);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;

            padding: 14px 28px;
            border-radius: 16px;

            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--call-color);
            box-shadow: 0 0 30px var(--call-glow);

            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.08s ease;
        }

        .line-call.show {
            opacity: 1;
        }

        .line-call-title {
            display: none;
        }

        .line-call-result {
            font-size: 56px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 3px;
            color: var(--call-color);
            text-shadow: 0 0 18px var(--call-glow);
        }

        .line-call-detail {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        .line-call-detail:empty {
            display: none;
        }

        /* =========================
           LINE CALL CLIP (replay)
        ========================= */

        .line-call-clip {
            margin-top: 6px;
            width: 160px;

            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #000;

            opacity: 0;
            transform: translateY(-4px);
            pointer-events: none;
            transition: opacity 0.12s ease, transform 0.12s ease;
        }

        .line-call-clip.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .line-call-clip video {
            display: block;
            width: 100%;
            height: auto;
        }

        .line-call-clip-fallback {
            display: block;
            padding: 6px 8px;
            font-size: 10px;
            font-weight: 700;
            color: #9ad6ff;
            text-align: center;
            text-decoration: none;
        }

        .line-call-clip-fallback:hover {
            text-decoration: underline;
        }

        .line-call-clip-actions {
            display: flex;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .line-call-clip-download {
            flex: 1;
            display: none;

            padding: 6px 4px;

            font-size: 10px;
            font-weight: 700;
            color: #9ad6ff;
            text-align: center;
            text-decoration: none;

            background: none;
            border: none;
            cursor: pointer;
        }

        .line-call-clip-download:hover {
            text-decoration: underline;
        }

        .line-call-clip-download.disabled {
            color: #6f7782;
            cursor: default;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .line-call-clip {
                width: 120px;
            }
        }

        /* =========================
           COURT DIAGRAM (ball landing spot)
        ========================= */

        @keyframes dropIn {
            0% {
                transform: translateY(-40px) scale(0.6);
                opacity: 0;
            }
            60% {
                transform: translateY(4px) scale(1.15);
                opacity: 1;
            }
            80% {
                transform: translateY(-2px) scale(0.95);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }

        .court-panel {
            /* always red: dot + result text */
            --call-color: #ef4444;

            margin-top: 14px;

            display: flex;
            align-items: center;
            gap: 16px;

            padding: 14px 16px;

            background: #12151a;
            border: 1px solid #20242b;
            border-radius: 14px;

            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.15s ease;
        }

        .court-panel.show {
            opacity: 1;
            max-height: 300px;
        }

        .court-diagram-wrap {
            flex-shrink: 0;
            width: 110px;
        }

        .court-diagram-wrap svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .court-outline {
            fill: #0b0d10;
            stroke: #4b5563;
            stroke-width: 2;
        }

        .court-net {
            stroke: #6b7280;
            stroke-width: 3;
            stroke-dasharray: 6 5;
        }

        .court-nvz-line,
        .court-center-line {
            stroke: #374151;
            stroke-width: 1.5;
        }

        #courtMarker {
            fill: var(--call-color, #ef4444);
            stroke: #ffffff;
            stroke-width: 2;
            transform-origin: center;
            transform-box: fill-box;
        }

        #courtMarker.drop {
            animation: dropIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .court-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .court-info-result {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--call-color, #ffffff);
        }

        .court-info-detail {
            font-size: 12px;
            color: #aeb5bf;
        }

        .court-info-coords {
            font-size: 11px;
            color: #6f7782;
        }

        @media (max-width: 480px) {

            .court-panel {
                padding: 10px 12px;
                gap: 10px;
            }

            .court-diagram-wrap {
                width: 76px;
            }

            .court-info-result {
                font-size: 14px;
            }

            .court-info-detail {
                font-size: 11px;
            }

            .court-info-coords {
                font-size: 10px;
            }
        }

        /* =========================
           INFO
        ========================= */

        .info {
            margin-top: 14px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 14px 16px;

            background: #12151a;
            border: 1px solid #20242b;
            border-radius: 14px;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 14px;
            color: #aeb5bf;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--state-color);
            box-shadow: 0 0 8px var(--state-glow);
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        body[data-state="connecting"] .connection-dot {
            animation: pulse 1.2s ease-in-out infinite;
        }

        #connectionText {
            color: var(--state-color);
            font-weight: 600;
            transition: color 0.25s ease;
        }

        .session {
            font-size: 12px;
            color: #6f7782;
            text-align: right;
            word-break: break-all;
        }

        /* =========================
           RESPONSIVE - TABLET
        ========================= */

        @media (max-width: 768px) {

            body {
                padding: 14px;
                align-items: flex-start;
            }

            .app {
                margin-top: 8px;
            }

            .header {
                margin-bottom: 12px;
            }

            .brand h1 {
                font-size: 18px;
            }

            .viewer-label {
                font-size: 12px;
            }

            .video-card {
                border-radius: 14px;
            }

            #remoteVideo {
                min-height: 220px;
                max-height: 70vh;
            }

            .video-overlay {
                padding: 10px;
            }

            .status-badge,
            .fps-badge {
                font-size: 11px;
                padding: 7px 9px;
            }

            .line-call-result {
                font-size: 44px;
            }

            .info {
                padding: 12px;
                border-radius: 12px;
            }
        }

        /* =========================
           RESPONSIVE - MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 10px;
            }

            .app {
                margin-top: 4px;
            }

            .header {
                margin-bottom: 10px;
            }

            .brand {
                gap: 9px;
            }

            .brand-dot {
                width: 9px;
                height: 9px;
            }

            .brand h1 {
                font-size: 16px;
            }

            .viewer-label {
                font-size: 11px;
            }

            .video-card {
                border-radius: 12px;
            }

            #remoteVideo {
                min-height: 210px;
                max-height: 68vh;
            }

            .video-overlay {
                padding: 8px;
            }

            .status-badge,
            .fps-badge {
                font-size: 10px;
                padding: 6px 8px;
                border-radius: 8px;
            }

            .line-call {
                max-width: calc(100% - 24px);
                padding: 10px 14px;
                gap: 4px;
                white-space: normal;
            }

            .line-call-result {
                font-size: clamp(22px, 8vw, 34px);
                letter-spacing: 1px;
                text-align: center;
            }

            .line-call-detail {
                font-size: 12px;
                text-align: center;
            }

            .info {
                margin-top: 10px;
                padding: 10px 12px;

                flex-direction: column;
                align-items: flex-start;
            }

            .session {
                text-align: left;
                width: 100%;
            }
        }
    </style>
</head>

<body data-state="connecting">

    <main class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">
                <span class="brand-dot"></span>

                <h1>CALLITNOW</h1>
            </div>

            <span class="viewer-label">
                Live Viewer
            </span>

        </header>


        <!-- VIDEO -->
        <section class="video-card">

            <video
                id="remoteVideo"
                autoplay
                playsinline
                muted
            ></video>


            <!-- VIDEO OVERLAY -->
            <div class="video-overlay">

                <div
                    class="status-badge"
                    id="status"
                >
                    Connecting...
                </div>

                <div class="overlay-right">

                    <div
                        class="fps-badge"
                        id="fps"
                    >
                        FPS: --
                    </div>

                    <!-- LINE CALL (centered on the video, big, red) -->
                    <div class="line-call" id="lineCall">
                        <div class="line-call-title">LINE CALL</div>
                        <div class="line-call-result" id="lineCallResult">--</div>
                        <div class="line-call-detail" id="lineCallDetail"></div>
                    </div>

                    <!-- CLIP REPLAY (shows under the FPS badge when
                         the event carries a "url" pointing to the clip) -->
                    <div class="line-call-clip" id="lineCallClip">
                        <video
                            id="lineCallClipVideo"
                            muted
                            playsinline
                            autoplay
                        ></video>
                        <a
                            class="line-call-clip-fallback"
                            id="lineCallClipFallback"
                            href="#"
                            target="_blank"
                            rel="noopener"
                            style="display: none;"
                        >Open clip</a>

                        <div class="line-call-clip-actions">
                            <button
                                type="button"
                                class="line-call-clip-download"
                                id="lineCallClipDownload"
                            >⬇ Download</button>
                        </div>
                    </div>

                </div>

            </div>

        </section>


        <!-- BALL LANDING SPOT (court diagram) -->
        <section class="court-panel" id="courtPanel">

            <div class="court-diagram-wrap">
                <svg viewBox="-30 -30 260 500" xmlns="http://www.w3.org/2000/svg">

                    <!-- Court outline: 20ft wide x 44ft long, 10 units per ft -->
                    <rect
                        class="court-outline"
                        x="1" y="1" width="198" height="438"
                    ></rect>

                    <!-- Net (middle of the court) -->
                    <line
                        class="court-net"
                        x1="0" y1="220" x2="200" y2="220"
                    ></line>

                    <!-- NVZ / kitchen lines, 7ft from net each side -->
                    <line
                        class="court-nvz-line"
                        x1="0" y1="150" x2="200" y2="150"
                    ></line>
                    <line
                        class="court-nvz-line"
                        x1="0" y1="290" x2="200" y2="290"
                    ></line>

                    <!-- Center service lines (net to kitchen, both halves) -->
                    <line
                        class="court-center-line"
                        x1="100" y1="0" x2="100" y2="150"
                    ></line>
                    <line
                        class="court-center-line"
                        x1="100" y1="290" x2="100" y2="440"
                    ></line>

                    <!-- Ball landing marker -->
                    <circle
                        id="courtMarker"
                        cx="100"
                        cy="220"
                        r="7"
                        style="display: none;"
                    ></circle>

                </svg>
            </div>

            <div class="court-info">
                <div class="court-info-result" id="courtInfoResult">--</div>
                <div class="court-info-detail" id="courtInfoDetail"></div>
                <div class="court-info-coords" id="courtInfoCoords"></div>
            </div>

        </section>


        <!-- CONNECTION INFO -->
        <section class="info">

            <div class="connection">

                <span class="connection-dot"></span>

                <span id="connectionText">Connecting...</span>

            </div>

            <div
                class="session"
                id="sessionDisplay"
            >
                Session: fpsmonitor-session
            </div>

        </section>

    </main>


    <script>
        /*
         * Display current session ID.
         * app.js continues to handle WebRTC/signaling.
         */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const session =
            params.get("session") ||
            params.get("sessionId") ||
            "fpsmonitor-session";

        const sessionDisplay =
            document.getElementById(
                "sessionDisplay"
            );

        if (sessionDisplay) {
            sessionDisplay.textContent =
                `Session: ${session}`;
        }
    </script>


    <script>
        /*
         * CONNECTION STATE (green = connected, red = disconnected,
         * amber = connecting).
         *
         * app.js calls:
         *   window.setConnectionState("connected" | "disconnected" | "connecting")
         *
         * Yeh function sirf colors + neeche wala text badalta hai.
         * Upar wale status badge ka text app.js khud set karta hai (setStatus).
         */

        (function () {

            const LABELS = {
                connecting: "Connecting...",
                connected: "Connected",
                disconnected: "Disconnected"
            };

            const textEl = document.getElementById("connectionText");

            window.setConnectionState = function (state) {
                if (!LABELS[state]) return;

                document.body.dataset.state = state;

                if (textEl) textEl.textContent = LABELS[state];
            };

        })();
    </script>

    <script src="app.js"></script>

</body>
</html>
