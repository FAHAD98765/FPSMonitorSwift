
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALLITNOW</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #101114;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            letter-spacing: 2px;
        }

        video {
            width: 100%;
            max-height: 70vh;
            display: block;
            background: #000;
            border-radius: 12px;
        }

        #status {
            color: #c8ff00;
            font-weight: bold;
        }

        #fps {
            color: #aaa;
        }

        #disconnectButton {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ff4545;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #disconnectButton:hover {
            background: #e52e2e;
        }

        #disconnectButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>CALLITNOW</h1>

        <video
            id="remoteVideo"
            autoplay
            playsinline
            muted
        ></video>

        <p id="status">Connecting...</p>
        <p id="fps">FPS: --</p>

        <button id="disconnectButton" type="button">
            Disconnect
        </button>
    </main>

    <script src="app.js"></script>
</body>
</html>
